[project]
name = "hutwatch"
version = "0.1.0"
description = "Read-only mountain hut booking availability monitor with alerting"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.2",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
    "playwright==1.47.0",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "respx==0.21.1",
]

[project.scripts]
hutwatch = "hutwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hutwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
